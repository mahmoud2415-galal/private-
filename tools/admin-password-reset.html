<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعادة تعيين كلمة مرور المدير</title><style>body{font:18px system-ui;background:#eef3f6;color:#183746;padding:24px}main{max-width:620px;margin:auto;background:white;padding:24px;border-radius:16px}label{display:block;margin-top:18px}input,button,textarea{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:1px solid #abc;border-radius:8px;margin-top:8px}button{background:#183746;color:white}textarea{direction:ltr;font:14px monospace;height:220px}p{line-height:1.7}</style><main><h1>كلمة مرور المدير</h1><p>كلمة المرور تبقى داخل هذه الصفحة. اكتبها مرتين ثم انسخ أمر التحديث إلى SQL Editor في Supabase.</p><form id="form"><label>كلمة المرور الجديدة<input id="password" type="password" minlength="12" maxlength="80" autocomplete="new-password" required></label><label>تأكيد كلمة المرور<input id="confirm" type="password" minlength="12" maxlength="80" autocomplete="new-password" required></label><label>الإصدار الحالي<input id="version" type="number" min="1" step="1" value="4" required></label><button>تحقق وجهّز التحديث</button></form><p id="status" role="status"></p><section id="result" hidden><textarea id="sql" readonly aria-label="أمر تحديث الحساب"></textarea><button id="copy">نسخ أمر التحديث</button><p>الصق الأمر في SQL Editor واضغط Run مرة واحدة. زيادة الإصدار تنهي الجلسات القديمة. سجل الدخول باسم admin وكلمة المرور الجديدة.</p></section></main><script>
const form=document.getElementById('form'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),version=document.getElementById('version'),status=document.getElementById('status'),result=document.getElementById('result'),sql=document.getElementById('sql'),copy=document.getElementById('copy');
const enc=new TextEncoder();const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
async function derive(value,salt){const key=await crypto.subtle.importKey('raw',enc.encode(value),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256));}
form.addEventListener('submit',async e=>{e.preventDefault();result.hidden=true;sql.value='';const p=password.value,v=Number(version.value);if(p!==confirm.value){status.textContent='كلمتا المرور غير متطابقتين';return;}if(p.length<12||p.length>80||!p.trim()||!Number.isSafeInteger(v)||v<1){status.textContent='استخدم كلمة مرور من 12 إلى 80 حرفًا وإصدارًا صحيحًا';return;}try{const salt=crypto.getRandomValues(new Uint8Array(16)),digest=await derive(p,salt),hash='pbkdf2$100000$'+hex(salt)+'$'+digest;if(await derive(confirm.value,salt)!==digest)throw Error();sql.value="UPDATE public.accounts SET password_hash = '"+hash+"', version = version + 1 WHERE id = 'admin' AND active = 1 AND version = "+v+" RETURNING id, active, version;";password.value='';confirm.value='';status.textContent='تم التحقق. الأمر جاهز.';result.hidden=false;}catch{status.textContent='تعذر التشفير. افتح الصفحة عبر HTTPS.';}});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(sql.value);status.textContent='تم نسخ الأمر. الصقه في Supabase.';}catch{sql.focus();sql.select();status.textContent='تم تحديد الأمر كاملًا. اختر نسخ.';}});form.addEventListener('input',()=>{result.hidden=true;sql.value='';status.textContent='';});
</script></html>
